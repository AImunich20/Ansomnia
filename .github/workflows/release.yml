name: Release

# Every push to main: read CFBundleShortVersionString from
# Resources/Info.plist. If v<version> has no tag yet, run the tests, build
# the DMG with scripts/make-dmg.sh and publish it as the GitHub Release
# v<version>, marked Latest. A push that keeps the version finishes in
# seconds.
#
# The tests run in their own job, after the release, not before it:
# they take about 18 minutes and the build about one, and a failure never
# held the release back anyway. The release is out in about two minutes;
# the test job's result shows on the same run soon after. To ship a new version, bump the version in Resources/Info.plist
# and push.
#
# Installed copies find the release with Settings > App > Check for updates,
# and "Download and install" fetches Ansomnia-<version>.dmg and SHA256SUMS
# from it. The README's download link is releases/latest/download/Ansomnia.dmg.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Plan
        id: plan
        run: |
          version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resources/Info.plist CFBundleShortVersionString is '$version', not major.minor.patch"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump CFBundleShortVersionString in Resources/Info.plist to publish a new version."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain
        if: steps.plan.outputs.publish == 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Build DMG
        if: steps.plan.outputs.publish == 'true'
        run: scripts/make-dmg.sh --output dist

      - name: Publish release
        if: steps.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            echo "Ansomnia $VERSION for Apple Silicon Macs with macOS 26 or later."
            echo
            echo "**Install:** download \`Ansomnia.dmg\`, open it, then in Terminal run:"
            echo
            echo '```'
            echo 'bash "/Volumes/Ansomnia/Install Ansomnia.command"'
            echo '```'
            echo
            echo "**Update:** Settings > App > Check for updates > Download and install."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "v$VERSION" \
            "dist/Ansomnia-$VERSION.dmg" dist/Ansomnia.dmg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ansomnia $VERSION" --notes-file notes.md --latest

      - name: Keep the DMG (manual runs off main)
        if: steps.plan.outputs.publish == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ansomnia-dmg
          path: dist/

  # The suite was written for a local Mac; a failure here is shown on the
  # run but does not hold the release back. Runs only when the release job
  # publishes, so a push that keeps the version still costs seconds.
  test:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: swift test
