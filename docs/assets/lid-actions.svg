<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="la-title la-desc">
  <title id="la-title">Ansomnia lid actions during a session</title>
  <desc id="la-desc">A simplified three-column diagram. Left, an illustrated Settings excerpt titled Lid-close actions: the freeze list contains Slack, WhatsApp and Discord; Pause idle Docker is off; Mute audio is on. Arrows lead to the middle column, Lid closes: freeze selected apps, pause idle Docker, mute if enabled. Docker is paused only if the rule is on and two checks, the second right before the pause, find no containers running; a container that is still starting can slip past the second check. Muting saves your volume first. An arrow leads to the right column, Lid opens: try to restore, session continues. Ansomnia resumes only the freezes it can verify it made, resumes Docker only if this rule paused it, and restores the saved volume. The timer never stopped; only its on-screen redraw paused. This repeats every time the lid closes and opens. Without an active session the lid does nothing. The Settings panel is a simplified illustration, not a screenshot.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F3F2EF; }
    .panel { fill: #FAF9F6; stroke: #DBD9D4; stroke-width: 1.5; }
    .sep { stroke: #DBD9D4; stroke-width: 1.5; }
    .t { fill: #292D30; }
    .m { fill: #5F6467; }
    .a { fill: #536D78; }
    .ln { fill: none; stroke: #536D78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ic { fill: none; stroke: #292D30; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mark-line { fill: none; stroke: #292D30; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mark-fill { fill: #292D30; }
    .knob { fill: #FFFFFF; }
    .on { fill: #536D78; }
    .off { fill: #C9C8C3; }
    .remove { fill: #9A9C9E; }
    .minus { fill: none; stroke: #FFFFFF; stroke-width: 2.4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #242628; }
      .panel { fill: #303336; stroke: #3E4145; }
      .sep { stroke: #3E4145; }
      .t { fill: #E6E3DD; }
      .m { fill: #B5B7B8; }
      .a { fill: #A6BBC3; }
      .ln { stroke: #A6BBC3; }
      .ic { stroke: #E6E3DD; }
      .mark-line { stroke: #E6E3DD; }
      .mark-fill { fill: #E6E3DD; }
      .on { fill: #A6BBC3; }
      .off { fill: #45494D; }
      .remove { fill: #7A7D80; }
    }
  </style>
  <defs>
    <!-- MoonMarkGeometry on its 24-unit grid, monochrome (docs/assets/moon.svg has the same paths). Closed: the crescent alone,
         while the Mac sleeps as usual. Open: slashed through while a session holds sleep off, the slash cutting a gap in the crescent. -->
    <mask id="la-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <path d="M3.5 20.5 L20.5 3.5" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    </mask>
    <g id="la-mark-closed">
      <path class="mark-line" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
    </g>
    <g id="la-mark-open">
      <path class="mark-line" mask="url(#la-mark-gap)" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
      <path class="mark-line" d="M3.5 20.5 L20.5 3.5"/>
    </g>
    <marker id="la-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="460" rx="24"/>

  <!-- Header -->
  <g transform="translate(32 20) scale(1.6667)">
    <use href="#la-mark-open"/>
  </g>
  <text class="t" x="88" y="50" font-size="26" font-weight="700">What the lid does during a session</text>

  <!-- Column 1: simplified Settings illustration -->
  <g>
    <rect class="panel" x="32" y="80" width="300" height="300" rx="16"/>
    <text class="t" x="52" y="114" font-size="20" font-weight="700">Lid-close actions</text>

    <text class="t" x="52" y="158" font-size="19">Slack</text>
    <circle class="remove" cx="302" cy="152" r="10"/>
    <path class="minus" d="M296 152 H308"/>
    <text class="t" x="52" y="192" font-size="19">WhatsApp</text>
    <circle class="remove" cx="302" cy="186" r="10"/>
    <path class="minus" d="M296 186 H308"/>
    <text class="t" x="52" y="226" font-size="19">Discord</text>
    <circle class="remove" cx="302" cy="220" r="10"/>
    <path class="minus" d="M296 220 H308"/>

    <path class="sep" d="M52 250 H312"/>

    <!-- Docker toggle: off -->
    <text class="t" x="52" y="290" font-size="19">Pause idle Docker</text>
    <rect class="off" x="260" y="268" width="52" height="30" rx="15"/>
    <circle class="knob" cx="275" cy="283" r="12"/>

    <!-- Mute toggle: on -->
    <text class="t" x="52" y="348" font-size="19">Mute audio</text>
    <rect class="on" x="260" y="326" width="52" height="30" rx="15"/>
    <circle class="knob" cx="297" cy="341" r="12"/>
  </g>
  <text class="m" x="32" y="406" font-size="17">Simplified Settings</text>

  <!-- Arrows: each setting to its lid-close action -->
  <path class="ln" d="M340 186 H366" marker-end="url(#la-arrow)"/>
  <path class="ln" d="M340 283 H366" marker-end="url(#la-arrow)"/>
  <path class="ln" d="M340 341 H366" marker-end="url(#la-arrow)"/>

  <!-- Column 2: Lid closes -->
  <g>
    <rect class="panel" x="372" y="80" width="290" height="300" rx="16"/>
    <g class="ic" transform="translate(392 96)">
      <rect x="2" y="16" width="36" height="8" rx="3"/>
      <path d="M8 11 H32"/>
    </g>
    <text class="t" x="444" y="120" font-size="22" font-weight="700">Lid closes</text>

    <text class="t" x="392" y="193" font-size="20" font-weight="600">Freeze selected apps</text>
    <text class="t" x="392" y="290" font-size="20" font-weight="600">Pause idle Docker</text>
    <text class="t" x="392" y="348" font-size="20" font-weight="600">Mute if enabled</text>
  </g>

  <path class="ln" d="M670 230 H696" marker-end="url(#la-arrow)"/>

  <!-- Column 3: Lid opens -->
  <g>
    <rect class="panel" x="702" y="80" width="266" height="300" rx="16"/>
    <g class="ic" transform="translate(722 96)">
      <rect x="8" y="2" width="24" height="17" rx="3"/>
      <rect x="2" y="22" width="36" height="6" rx="3"/>
    </g>
    <text class="t" x="774" y="120" font-size="22" font-weight="700">Lid opens</text>

    <text class="t" x="722" y="193" font-size="20" font-weight="600">Try to restore</text>
    <text class="t" x="722" y="290" font-size="20" font-weight="600">Session continues</text>
  </g>

  <!-- Footer -->
  <g class="ic">
    <circle cx="44" cy="436" r="10"/>
    <path d="M44 431 V436 H48.5"/>
  </g>
  <text class="m" x="64" y="442" font-size="19">Active sessions only. Timer keeps running.</text>
</svg>
