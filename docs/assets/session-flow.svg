<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="170" viewBox="0 0 1130 170" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Ansomnia session in the menu bar</title>
  <desc id="sb-desc">Three menu bar snapshots side by side. Set a duration: clicking the crescent moon shows three pills labelled Days, Hours and Minutes, with Hours focused. Watch the countdown: a slash is drawn through the moon, and a live countdown of 3:59:41 ticks beside it, followed by a small x. Click × to end: one click on the x next to the countdown, which reads 3:59:40, ends the session.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #242628; }
    .cap { fill: #E6E3DD; }
    .bar { fill: #1E1F21; stroke: #FFFFFF; stroke-opacity: 0.08; stroke-width: 1.5; }
    .mark-line { fill: none; stroke: #FFFFFF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mark-fill { fill: #FFFFFF; }
    .pill { fill: #17191B; fill-opacity: 0.92; stroke: #FFFFFF; stroke-opacity: 0.10; stroke-width: 0.9; }
    .pill-ph { fill: #FFFFFF; fill-opacity: 0.42; }
    .focus { fill: none; stroke: #A6BBC3; stroke-width: 2.7; }
    .count { fill: #FFFFFF; }
    .track { fill: none; stroke: #FFFFFF; stroke-opacity: 0.14; stroke-width: 2.9; }
    .prog { fill: none; stroke: #A6BBC3; stroke-width: 2.9; stroke-linecap: round; }
    .x { fill: none; stroke: #FFFFFF; stroke-opacity: 0.85; stroke-width: 2.6; stroke-linecap: round; }
  </style>
  <defs>
    <!-- MoonMarkGeometry on its 24-unit grid, monochrome (docs/assets/moon.svg has the same paths). Closed: the crescent alone,
         while the Mac sleeps as usual. Open: slashed through while a session holds sleep off, the slash cutting a gap in the crescent. -->
    <mask id="sb-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <path d="M3.5 20.5 L20.5 3.5" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    </mask>
    <g id="sb-mark-closed">
      <path class="mark-line" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
    </g>
    <g id="sb-mark-open">
      <path class="mark-line" mask="url(#sb-mark-gap)" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
      <path class="mark-line" d="M3.5 20.5 L20.5 3.5"/>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="1130" height="170" rx="24"/>

  <!-- Single row. Every strip is the menu bar excerpt at native proportions, enlarged 1.25x.
       Outer padding 28, gap between groups 32. Strips share the top edge y=72 and bottom edge y=142;
       captions share the baseline y=50 and are centred over their own strip. -->

  <!-- 1. Set a duration: bar 388 x 56 native, 485 x 70 drawn, x 28..513 -->
  <text class="cap" x="270.5" y="50" font-size="24" font-weight="600" text-anchor="middle">Set a duration</text>
  <g transform="translate(28 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="388" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-closed"/>
    </g>
    <rect class="pill" x="62" y="11" width="80" height="34" rx="12.6"/>
    <text class="pill-ph" x="102" y="36" font-size="22" text-anchor="middle">Days</text>
    <rect class="pill" x="154" y="11" width="92" height="34" rx="12.6"/>
    <rect class="focus" x="155.4" y="12.4" width="89.2" height="31.2" rx="11.2"/>
    <text class="pill-ph" x="200" y="36" font-size="22" text-anchor="middle">Hours</text>
    <rect class="pill" x="258" y="11" width="116" height="34" rx="12.6"/>
    <text class="pill-ph" x="316" y="36" font-size="22" text-anchor="middle">Minutes</text>
  </g>

  <!-- 2. Watch the countdown: bar 210 x 56 native, 262.5 x 70 drawn, x 545..807.5 -->
  <text class="cap" x="676.25" y="50" font-size="24" font-weight="600" text-anchor="middle">Watch the countdown</text>
  <g transform="translate(545 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="210" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-open"/>
    </g>
    <text class="count" x="62" y="36" font-size="24" font-weight="500">3:59:41</text>
    <g transform="translate(174 28)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
  </g>

  <!-- 3. Click x to end: same strip, the x under the pointer, x 839.5..1102 -->
  <text class="cap" x="970.75" y="50" font-size="24" font-weight="600" text-anchor="middle">Click × to end</text>
  <g transform="translate(839.5 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="210" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-open"/>
    </g>
    <text class="count" x="62" y="36" font-size="24" font-weight="500">3:59:40</text>
    <g transform="translate(174 28) scale(1.12)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
  </g>
</svg>
