<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="rf-title rf-desc">
  <title id="rf-title">Ansomnia recovery flow</title>
  <desc id="rf-desc">A simplified diagram of two paths that converge. App cleanup runs at the end of a session or when the app reopens. A separate backup check runs every 60 seconds and leaves a valid, unexpired session alone. Both converge on one step: try to restore verified changes. Only changes that can be verified are undone; failed or unreadable evidence is kept rather than treated as clean. Below that, a warning: may need your attention. Two things can need it: saved audio is restored only by reopening the app, and an unconfirmed freeze means you should inspect the process yourself. The backup check undoes recorded changes only. It is not battery or thermal monitoring and cannot restore audio. On the left, an illustrated example of the right-click menu while cleanup is still pending shows a warning line reading Sleep still held with no session, a status line, then Settings and Quit Ansomnia. It is an illustration, not a screenshot.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F3F2EF; }
    .panel { fill: #FAF9F6; stroke: #DBD9D4; stroke-width: 1.5; }
    .menu { fill: #F7F6F3; stroke: #CFCDC8; stroke-width: 1.5; }
    .sep { stroke: #DBD9D4; stroke-width: 1.5; }
    .t { fill: #292D30; }
    .m { fill: #5F6467; }
    .a { fill: #536D78; }
    .ln { fill: none; stroke: #536D78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ic { fill: none; stroke: #292D30; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mark-line { fill: none; stroke: #292D30; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mark-fill { fill: #292D30; }
    .warn { fill: #A85A00; }
    .warn-ic { fill: none; stroke: #A85A00; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #242628; }
      .panel { fill: #303336; stroke: #3E4145; }
      .menu { fill: #383B3F; stroke: #4A4D51; }
      .sep { stroke: #4A4D51; }
      .t { fill: #E6E3DD; }
      .m { fill: #B5B7B8; }
      .a { fill: #A6BBC3; }
      .ln { stroke: #A6BBC3; }
      .ic { stroke: #E6E3DD; }
      .mark-line { stroke: #E6E3DD; }
      .mark-fill { fill: #E6E3DD; }
      .warn { fill: #F2A854; }
      .warn-ic { stroke: #F2A854; }
    }
  </style>
  <defs>
    <!-- MoonMarkGeometry on its 24-unit grid, monochrome (docs/assets/moon.svg has the same paths). Closed: the crescent alone,
         while the Mac sleeps as usual. Open: slashed through while a session holds sleep off, the slash cutting a gap in the crescent. -->
    <mask id="rf-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <path d="M3.5 20.5 L20.5 3.5" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    </mask>
    <g id="rf-mark-closed">
      <path class="mark-line" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
    </g>
    <g id="rf-mark-open">
      <path class="mark-line" mask="url(#rf-mark-gap)" d="M20.3816 13.4137 C19.6008 18.0428 15.2153 21.1624 10.5863 20.3816 C5.9572 19.6008 2.8376 15.2153 3.6184 10.5863 C4.2204 7.0169 7.0169 4.2204 10.5863 3.6184 C8.2768 6.7188 8.918 11.1043 12.0184 13.4137 C14.4998 15.2621 17.9002 15.2621 20.3816 13.4137 Z"/>
      <path class="mark-line" d="M3.5 20.5 L20.5 3.5"/>
    </g>
    <marker id="rf-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="420" rx="24"/>

  <!-- Header -->
  <g transform="translate(32 20) scale(1.6667)">
    <use href="#rf-mark-closed"/>
  </g>
  <text class="t" x="88" y="50" font-size="26" font-weight="700">Two ways back to normal</text>

  <!-- Example right-click menu while cleanup is pending (illustration) -->
  <g>
    <rect class="menu" x="32" y="112" width="380" height="168" rx="12"/>
    <text class="warn" x="52" y="146" font-size="19">Sleep still held with no session</text>
    <text class="m" x="52" y="176" font-size="19">Lid: open · 87%</text>
    <path class="sep" d="M44 192 H400"/>
    <text class="t" x="52" y="224" font-size="19">Settings…</text>
    <text class="m" x="392" y="224" font-size="19" text-anchor="end">⌘,</text>
    <text class="t" x="52" y="258" font-size="19">Quit Ansomnia</text>
    <text class="m" x="392" y="258" font-size="19" text-anchor="end">⌘Q</text>
  </g>
  <text class="m" x="32" y="310" font-size="17">Menu while cleanup is pending. Illustration.</text>

  <!-- Node: app cleanup -->
  <g>
    <rect class="panel" x="452" y="80" width="250" height="120" rx="16"/>
    <g transform="translate(472 96) scale(1.3333)">
      <use href="#rf-mark-closed"/>
    </g>
    <text class="t" x="516" y="122" font-size="22" font-weight="700">App cleanup</text>
    <text class="m" x="472" y="170" font-size="19">At end or reopen</text>
  </g>

  <!-- Node: backup check -->
  <g>
    <rect class="panel" x="718" y="80" width="250" height="120" rx="16"/>
    <g class="ic" transform="translate(738 98)">
      <circle cx="16" cy="16" r="13"/>
      <path d="M16 8 V16 H22"/>
    </g>
    <text class="t" x="782" y="122" font-size="22" font-weight="700">Backup check</text>
    <text class="m" x="738" y="170" font-size="19">Every 60 seconds</text>
  </g>

  <!-- Converge -->
  <path class="ln" d="M577 200 V224 H843 V200"/>
  <path class="ln" d="M710 224 V244" marker-end="url(#rf-arrow)"/>

  <!-- Restore -->
  <g>
    <rect class="panel" x="452" y="248" width="516" height="76" rx="16"/>
    <text class="t" x="710" y="294" font-size="22" font-weight="700" text-anchor="middle">Try to restore verified changes</text>
  </g>

  <!-- Warning -->
  <path class="ln" d="M710 324 V350" marker-end="url(#rf-arrow)"/>
  <g class="warn-ic">
    <path d="M567 362 L579 384 H555 Z"/>
    <path d="M567 370 V377"/>
    <path d="M567 380.5 V381"/>
  </g>
  <text class="warn" x="590" y="382" font-size="22" font-weight="700">May need your attention</text>
</svg>
